<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071426">
  <title>E-Report | Productivity OS — CTRL+Z</title>

  <style>
    :root {
      --bg: #06111f;
      --panel: #0b1c30;
      --panel2: #102740;
      --cyan: #43e3ff;
      --cyan2: #9af2ff;
      --text: #edf8ff;
      --muted: #a6bdcf;
      --line: rgba(67,227,255,.22);
      --orange: #ff9b54;
      --radius: 22px;
      --max: 1120px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      margin: 0;
      background: radial-gradient(ellipse at 80% 0%, #12395a 0, transparent 35%), var(--bg);
      color: var(--text);
      font-family: Tahoma, "Noto Sans Thai", Arial, sans-serif;
      line-height: 1.8;
    }

    a {
      color: var(--cyan2);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(6,17,31,.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      max-width: var(--max);
      margin: auto;
      padding: 12px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      font-weight: 800;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .brand span {
      color: var(--cyan);
    }

    .navlinks {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: .88rem;
    }

    .navlinks a {
      color: var(--muted);
    }

    .navlinks a:hover {
      color: var(--cyan);
    }

    /* เมนู Resume */
    .navlinks .resume-link {
      color: var(--cyan);
      font-weight: 800;
    }

    .hero {
      max-width: var(--max);
      margin: auto;
      padding: 86px 22px 62px;
      min-height: 520px;
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      align-items: center;
      gap: 40px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--cyan);
      font-size: .82rem;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 18px var(--cyan);
    }

    h1 {
      font-size: clamp(2.7rem, 7vw, 5.5rem);
      line-height: 1.06;
      margin: 18px 0 20px;
      letter-spacing: -.04em;
    }

    h1 span {
      display: block;
      color: var(--cyan);
      text-shadow: 0 0 28px rgba(67,227,255,.18);
    }

    .lead {
      color: var(--muted);
      font-size: 1.08rem;
      max-width: 650px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 17px;
      border-radius: 12px;
      border: 1px solid var(--line);
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      font-size: .95rem;
    }

    .btn.primary {
      background: var(--cyan);
      color: #06111f;
      border-color: var(--cyan);
    }

    .btn.secondary {
      color: var(--text);
      background: rgba(255,255,255,.03);
    }

    .btn.resume-button {
      background: rgba(67,227,255,.1);
      color: var(--cyan);
      border-color: var(--cyan);
    }

    .btn:hover {
      transform: translateY(-2px);
      text-decoration: none;
    }

    .hero-visual {
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 18px;
      background: linear-gradient(145deg, rgba(16,39,64,.94), rgba(7,20,38,.9));
      box-shadow: 0 22px 70px rgba(0,0,0,.25);
      position: relative;
      overflow: hidden;
    }

    .hero-visual:before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border: 1px solid rgba(67,227,255,.17);
      border-radius: 50%;
      right: -55px;
      top: -55px;
      box-shadow: 0 0 0 24px rgba(67,227,255,.025), 0 0 0 50px rgba(67,227,255,.02);
    }

    .screen-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: .78rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
    }

    .screen-title {
      font-size: 1.2rem;
      font-weight: 800;
      margin: 18px 0 4px;
    }

    .screen-sub {
      font-size: .86rem;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .metric {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .metric div {
      background: rgba(67,227,255,.055);
      border: 1px solid var(--line);
      padding: 15px;
      border-radius: 15px;
    }

    .metric strong {
      display: block;
      color: var(--cyan);
      font-size: 1.45rem;
    }

    .metric small {
      color: var(--muted);
    }

    .visual-note {
      margin-top: 14px;
      padding: 12px;
      border-left: 3px solid var(--orange);
      background: rgba(255,155,84,.07);
      font-size: .8rem;
      color: #ffd4b7;
    }

    main {
      max-width: var(--max);
      margin: auto;
      padding: 0 22px 70px;
    }

    section {
      padding: 40px 0;
    }

    .section-head {
      margin-bottom: 22px;
    }

    .kicker {
      color: var(--cyan);
      font-size: .78rem;
      letter-spacing: .15em;
      font-weight: 700;
    }

    h2 {
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      line-height: 1.25;
      margin: 8px 0 10px;
    }

    .section-intro {
      color: var(--muted);
      max-width: 780px;
      margin: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      background: linear-gradient(145deg, rgba(16,39,64,.8), rgba(10,26,44,.86));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 23px;
    }

    .card h3 {
      margin: 0 0 9px;
      font-size: 1.1rem;
    }

    .card p {
      margin: 0;
      color: var(--muted);
    }

    .number {
      color: var(--cyan);
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .1em;
    }

    .profile {
      display: grid;
      grid-template-columns: .75fr 1.25fr;
      gap: 20px;
    }

    .profile-badge {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: 245px;
      background: linear-gradient(145deg, #103553, #0a1b2e);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
    }

    .profile-badge strong {
      font-size: 1.1rem;
    }

    .profile-badge small {
      color: var(--muted);
    }

    .details {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 8px 14px;
      margin: 0;
    }

    .details dt {
      color: var(--muted);
    }
